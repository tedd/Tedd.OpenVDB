name: Build, test and publish
on:
  push:
    branches: [main, deploy]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        intrinsics: ['1', '0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build Tedd.OpenVDB.slnx -c Release
      - run: dotnet test Tedd.OpenVDB.slnx -c Release --no-build
        env:
          DOTNET_EnableHWIntrinsic: ${{ matrix.intrinsics }}
      - run: dotnet run --project samples/VoxelBlocks -c Release --no-build
  publish:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: nuget-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build package
        run: dotnet build src/Tedd.OpenVDB/Tedd.OpenVDB.csproj -c Release
      - name: Log in to NuGet.org with OIDC
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: tedd
      - name: Publish NuGet package
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem -LiteralPath 'src/Tedd.OpenVDB/bin/Release' -Filter 'Tedd.OpenVDB.*.nupkg' -File)
          if ($packages.Count -ne 1) {
            throw "Expected one package, found $($packages.Count)."
          }

          dotnet nuget push $packages[0].FullName `
            --api-key $env:NUGET_API_KEY `
            --source 'https://api.nuget.org/v3/index.json' `
            --symbol-api-key $env:NUGET_API_KEY `
            --symbol-source 'https://api.nuget.org/v3/index.json' `
            --skip-duplicate `
            --force-english-output
